services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: task-workflow-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    container_name: task-workflow-postgres
    environment:
      POSTGRES_DB: task_workflow
      POSTGRES_USER: task_workflow
      POSTGRES_PASSWORD: task_workflow
    ports:
      # 5433 (não 5432): esta máquina já tem um PostgreSQL nativo (Windows Service) ocupando a
      # porta padrão. Mapear pra 5432 fazia toda conexão externa (inclusive do Spring) cair
      # nesse Postgres nativo em vez do container, causando "autenticação falhou" (o container
      # nunca via a conexão). Ver application.yml, que já aponta pra 5433.
      - "5433:5432"
    volumes:
      - task-workflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_workflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-workflow-backend
    environment:
      # porta interna do Postgres na rede do compose é 5432, não a 5433 mapeada pro host
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/task_workflow
      SPRING_DATASOURCE_USERNAME: task_workflow
      SPRING_DATASOURCE_PASSWORD: task_workflow
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: "5672"
      # IA requer login OAuth por máquina; não dá pra autenticar dentro do container (ver README)
      TASK_WORKFLOW_AI_ENABLED: "false"
    ports:
      - "8080:8080"
    volumes:
      - ./test-html:/workspace/test-html
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: task-workflow-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  task-workflow-postgres-data:
